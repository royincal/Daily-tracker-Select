const u=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function dec(pw){
 const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
 const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u(S),iterations:310000,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
 const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:u(I)},k,u(C));
 return new TextDecoder().decode(pt);}
document.getElementById("f").onsubmit=async ev=>{ev.preventDefault();
 try{const h=await dec(document.getElementById("pw").value);
  sessionStorage.setItem("tpw",document.getElementById("pw").value);
  document.open();document.write(h);document.close();}
 catch(_){document.getElementById("e").style.display="block";}};
