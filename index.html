<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Select Daily Tracker — Login</title><style>
body{font:15px -apple-system,Segoe UI,Roboto,sans-serif;background:#f7f7f9;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0}
.box{background:#fff;border:1px solid #e4e4ea;border-radius:14px;padding:34px 38px;max-width:360px;width:90%;text-align:center}
h1{font-size:17px;color:#5f206e;margin:0 0 6px}p{color:#6e6e78;font-size:13px;margin:0 0 18px}
input{width:100%;padding:10px;border:1px solid #e4e4ea;border-radius:8px;font-size:15px;box-sizing:border-box;margin-bottom:10px}
button{width:100%;padding:10px;background:#7b2d8e;color:#fff;border:0;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer}
.err{color:#c62828;font-size:13px;margin-top:10px;display:none}</style></head><body>
<div class="box"><h1>Select Daily Tracker</h1><p>Sign in with your HQ username and password.</p>
<form id="f"><input id="un" placeholder="Username (your HQ)" autocomplete="username" autofocus>
<input type="password" id="pw" placeholder="Password" autocomplete="current-password">
<button>Open my tracker</button><div class="err" id="e"></div></form></div>
<script>
const u=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function dec(b,pw){
 const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
 const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u(b.s),iterations:310000,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
 return new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:u(b.i)},k,u(b.c)));}
async function go(un,pw){
 const r=await fetch(un.toLowerCase().trim()+'.enc?v='+Date.now());
 if(!r.ok)throw 'user';
 const html=await dec(await r.json(),pw);
 sessionStorage.setItem('tun',un);sessionStorage.setItem('tpw',pw);
 document.open();document.write(html);document.close();}
document.getElementById('f').onsubmit=async ev=>{ev.preventDefault();const e=document.getElementById('e');
 try{await go(un.value,pw.value);}
 catch(x){e.textContent=x==='user'?'Unknown username.':'Wrong password.';e.style.display='block';}};
(async()=>{const a=sessionStorage.getItem('tun'),b=sessionStorage.getItem('tpw');
 if(a&&b){try{await go(a,b);}catch(_){}}})();
</script></body></html>
